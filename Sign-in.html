<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About I-coder</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
      footer {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
        }
    </style>
  </head>

  <body class="py-4 bg-body-tertiary">
    <main class="form-signin w-50 m-auto text-center">
      <form>
        <img src="Website_logo_3.png" class="mb-5" width="250" height="200" />
        <h1 class="h3 mb-5 fw-normal">Sign in to your I-coder Account</h1>
        <!-- Full Name -->
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="floatingName"
            placeholder="Full Name"
          />
          <label for="floatingName">Full Name</label>
        </div>

        <!-- Username -->
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="floatingUsername"
            placeholder="Username"
          />
          <label for="floatingUsername">Username</label>
        </div>

        <!-- Email -->
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="floatingEmail"
            placeholder="name@example.com"
          />
          <label for="floatingEmail">Email address</label>
        </div>

        <!-- Password -->
        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
          />
          <label for="floatingPassword">Password</label>
        </div>

        <!-- Coding Interest -->
        <div class="form-floating mb-3">
          <select class="form-select" id="floatingInterest">
            <option selected>Select your interest</option>
            <option>Web Development</option>
            <option>Data Science</option>
            <option>Devops</option>
            <option>AI & ML</option>
            <option>Cyber Security</option>
          </select>
          <label for="floatingInterest">Coding Interest</label>
        </div>

        <!-- Terms Checkbox -->
        <div class="form-check text-start my-5">
          <input class="form-check-input" type="checkbox" id="termsCheck" />

          <label class="form-check-label" for="termsCheck">
            I agree to the Terms & Conditions
          </label>
        </div>

        <!-- Signup Button -->
        <button class="btn btn-success w-23 py-2" type="submit">
          Create Account
        </button>
        <div class="form-check text-start my-4">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="checkDefault"
          />
          <label class="form-check-label" for="checkDefault">
            Remember me
          </label>
        </div>
        <button class="btn btn-primary w-23 py-2" type="submit">Sign in</button>
      </form>
    </main>

    <footer class="container">
      <p class="float-end"><a href="#">On Top</a></p>
      <p>
        © 2026 Abhinav's I-coder <a href="#">Privacy</a> ·
        <a href="#">Terms</a>
      </p>
    </footer>
  </body>
</html>
